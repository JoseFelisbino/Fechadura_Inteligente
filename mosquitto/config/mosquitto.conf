# Broker MQTT da fechadura inteligente.
# Publicação anônima desabilitada: cada dispositivo usa usuário = deviceId
# e senha = chave do dispositivo (gerada por `npm run device:provision`).

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Para produção, habilite TLS (exemplo):
# listener 8883
# cafile   /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile  /mosquitto/config/certs/server.key
