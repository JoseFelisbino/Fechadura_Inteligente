; Firmware da fechadura inteligente (ESP32 + Arduino).
; Compilar:  pio run
; Gravar:    pio run -t upload
; Monitor:   pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    chris--a/Keypad@^3.1.1
    256dpi/MQTT@^2.5.2
    bblanchon/ArduinoJson@^7.2.1
build_flags =
    -DCORE_DEBUG_LEVEL=1
