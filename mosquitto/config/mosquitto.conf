# Broker MQTT da fechadura inteligente (rede local, demonstração).
# Um único usuário, usado pelo backend, pelo Arduino e pelo simulador.
# Crie-o com:  cd backend && npm run mqtt:user   (lê MQTT_USERNAME/MQTT_PASSWORD do backend/.env)

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd

# Para aceitar conexões sem usuário (mais simples, mas qualquer um na rede pode publicar),
# troque as duas linhas acima por:
# allow_anonymous true
