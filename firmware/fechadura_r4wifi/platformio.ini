; Firmware da fechadura inteligente (Arduino Uno R4 WiFi).
; Compilar:  pio run
; Gravar:    pio run -t upload
; Monitor:   pio device monitor
;
; O código fica na pasta do sketch (fechadura_r4wifi/) para que a mesma fonte
; também abra na Arduino IDE (veja README.md desta pasta).

[platformio]
src_dir = fechadura_r4wifi

[env:uno_r4_wifi]
platform = renesas-ra
board = uno_r4_wifi
framework = arduino
monitor_speed = 115200
lib_deps =
    256dpi/MQTT@^2.5.2
    bblanchon/ArduinoJson@^7.2.1
    arduino-libraries/Servo@^1.2.2
